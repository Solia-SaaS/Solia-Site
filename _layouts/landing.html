<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solia — your life's operating system</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="Solia">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#0D0B06">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/css/landing.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="landing">

<!-- fixed scene: black space + star canvas. Content scrolls over it. -->
<div class="sky" aria-hidden="true">
  <canvas id="fx"></canvas>
</div>

<header class="landing-header" id="siteHeader">
  <a class="wordmark" href="#top" id="headerMark" aria-label="Solia home">
    <img src="{{ '/assets/brand/solia-wordmark-dark.svg' | relative_url }}" alt="Solia">
  </a>
  <a href="#soon" class="header-cta">Get early access</a>
  <details class="menu">
    <summary aria-label="Open menu">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="7" x2="20" y2="7"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="17" x2="20" y2="17"/>
      </svg>
    </summary>
    <nav>
      <a href="{{ '/support' | relative_url }}">Support</a>
      <a href="https://legal.getsolia.com">Legal</a>
    </nav>
  </details>
</header>

<!-- section dot navigation -->
<nav class="dots" aria-label="Sections">
  <a href="#top" data-dot="top"><span class="dot-label">Welcome</span><span class="dot-line"></span></a>
  <a href="#what" data-dot="what"><span class="dot-label">Overview</span><span class="dot-line"></span></a>
  <a href="#founder" data-dot="founder"><span class="dot-label">Founder</span><span class="dot-line"></span></a>
  <a href="#tour" data-dot="tour"><span class="dot-label">The app</span><span class="dot-line"></span></a>
  <a href="#soon" data-dot="soon"><span class="dot-label">Early access</span><span class="dot-line"></span></a>
</nav>

<main class="landing" id="top">
{{ content }}
</main>

<script src="{{ '/assets/js/landing.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
