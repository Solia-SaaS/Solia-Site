<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != "Solia" %}{{ page.title }} · Solia{% else %}Solia — your life's operating system{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{{ page.title | default: 'Solia' }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#14120B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E7E3D7" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site">
  <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Solia home">
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="{{ '/assets/brand/solia-wordmark-dark.svg' | relative_url }}">
      <img src="{{ '/assets/brand/solia-wordmark-light.svg' | relative_url }}" alt="Solia" width="112" height="44">
    </picture>
  </a>
  <nav>
    <a href="{{ '/support' | relative_url }}">Support</a>
    <a href="https://legal.getsolia.com">Legal</a>
  </nav>
</header>

<main{% if page.hero %} class="has-hero"{% endif %}>
  {{ content }}
</main>

<footer class="site">
  <p class="acronym"><strong>SOLIA</strong> — System for Optimizing Life with Intelligent Automation</p>
  <p>
    Support <a href="mailto:support@getsolia.com">support@getsolia.com</a> ·
    Privacy &amp; data requests <a href="mailto:privacy@getsolia.com">privacy@getsolia.com</a> ·
    General &amp; legal <a href="mailto:legal@getsolia.com">legal@getsolia.com</a>
  </p>
  <p><a href="https://legal.getsolia.com/terms-of-service">Terms of Service</a> · <a href="https://legal.getsolia.com/privacy-policy">Privacy Policy</a> · <a href="https://legal.getsolia.com/health-disclaimer">Health Disclaimer</a></p>
</footer>
</body>
</html>
