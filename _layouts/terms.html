<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · Solia</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{{ page.title }} · Solia">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#0D0B06">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/terms.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="tx">

<!-- Terms & Agreements (2026-10-21): its own layout, dark like the landing.
     No menu and no back link: the wordmark is the way home. -->
<header class="tx-header" id="txHeader">
  <a class="tx-wordmark" href="{{ '/' | relative_url }}" aria-label="Solia home">
    <img src="{{ '/assets/brand/solia-wordmark-dark.svg' | relative_url }}" alt="Solia">
  </a>
  <span class="tx-progress" id="txProgress" aria-hidden="true"></span>
</header>

<main class="tx-main" id="top">
{{ content }}
</main>

<footer class="tx-footer">
  <p class="tx-footer-acronym"><strong>SOLIA</strong> — System for Optimizing Life with Intelligent Automation</p>
  <p>
    Support <a href="mailto:support@getsolia.com">support@getsolia.com</a> ·
    Privacy &amp; data requests <a href="mailto:privacy@getsolia.com">privacy@getsolia.com</a> ·
    General &amp; legal <a href="mailto:legal@getsolia.com">legal@getsolia.com</a>
  </p>
</footer>

<a class="tx-top" id="txTop" href="#top" aria-label="Back to top">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</a>

<script src="{{ '/assets/js/terms.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
